  <rect x="200" y="645" width="800" height="100" rx="10" fill="#FBEAF0" stroke="#ED93B1" stroke-width="1.5"/>
  <text x="600" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#72243E">«BI layer» Business Intelligence — Looker / Tableau</text>

  <!-- BQ1 -->
  <rect x="230" y="678" width="220" height="52" rx="8" fill="white" stroke="#ED93B1" stroke-width="1"/>
  <text x="340" y="698" text-anchor="middle" font-size="11" font-weight="600" fill="#72243E">GPS effectiveness</text>
  <text x="340" y="714" text-anchor="middle" font-size="10" fill="#993556">BQ1 · BQ4 · BQ6</text>
  <text x="340" y="726" text-anchor="middle" font-size="10" fill="#993556">Map · GPS · Filters</text>

  <!-- BQ2 -->
  <rect x="490" y="678" width="220" height="52" rx="8" fill="white" stroke="#ED93B1" stroke-width="1"/>
  <text x="600" y="698" text-anchor="middle" font-size="11" font-weight="600" fill="#72243E">Data quality</text>
  <text x="600" y="714" text-anchor="middle" font-size="10" fill="#993556">BQ2 · BQ3</text>
  <text x="600" y="726" text-anchor="middle" font-size="10" fill="#993556">Listings · Offline cache</text>

  <!-- BQ3 -->
  <rect x="750" y="678" width="220" height="52" rx="8" fill="white" stroke="#ED93B1" stroke-width="1"/>
  <text x="860" y="698" text-anchor="middle" font-size="11" font-weight="600" fill="#72243E">User behavior</text>
  <text x="860" y="714" text-anchor="middle" font-size="10" fill="#993556">BQ5</text>
  <text x="860" y="726" text-anchor="middle" font-size="10" fill="#993556">Registration · Profile</text>

  <!-- ─── LEGEND ─── -->
  <rect x="30" y="758" width="1140" height="14" rx="4" fill="none"/>
  <rect x="30" y="756" width="8" height="8" rx="2" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text x="44" y="764" font-size="10" fill="#666">App events</text>
  <rect x="130" y="756" width="8" height="8" rx="2" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <text x="144" y="764" font-size="10" fill="#666">Real-time path</text>
  <rect x="250" y="756" width="8" height="8" rx="2" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
  <text x="264" y="764" font-size="10" fill="#666">Batch path</text>
  <rect x="350" y="756" width="8" height="8" rx="2" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="364" y="764" font-size="10" fill="#666">Data Warehouse</text>
  <rect x="470" y="756" width="8" height="8" rx="2" fill="#FBEAF0" stroke="#ED93B1" stroke-width="1"/>
  <text x="484" y="764" font-size="10" fill="#666">BI / Dashboards</text>
  <text x="700" y="764" font-size="10" fill="#999">BQ1–BQ6 = Business Questions defined in sprint</text>

</svg>
