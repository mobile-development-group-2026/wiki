  <text x="1080" y="165" text-anchor="middle" font-size="10" fill="#534AB7">suggestion_accepted</text>
  <text x="1080" y="179" text-anchor="middle" font-size="10" fill="#534AB7">suggestion_rejected</text>
  <text x="1080" y="193" text-anchor="middle" font-size="10" fill="#534AB7">matches_generated</text>

