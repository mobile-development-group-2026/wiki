  <text x="140" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">Map Events</text>
  <text x="140" y="165" text-anchor="middle" font-size="10" fill="#534AB7">map_opened</text>
  <text x="140" y="179" text-anchor="middle" font-size="10" fill="#534AB7">pin_tapped</text>
  <text x="140" y="193" text-anchor="middle" font-size="10" fill="#534AB7">listing_detail_viewed</text>

  <!-- GPS events -->
  <rect x="250" y="124" width="160" height="76" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text x="330" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">GPS Events</text>
  <text x="330" y="165" text-anchor="middle" font-size="10" fill="#534AB7">geofence_entered</text>
  <text x="330" y="179" text-anchor="middle" font-size="10" fill="#534AB7">alert_received</text>
  <text x="330" y="193" text-anchor="middle" font-size="10" fill="#534AB7">property_visited_48h</text>

