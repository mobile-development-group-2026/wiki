  <text x="710" y="165" text-anchor="middle" font-size="10" fill="#534AB7">listing_published</text>
  <text x="710" y="179" text-anchor="middle" font-size="10" fill="#534AB7">required_fields_filled</text>
  <text x="710" y="193" text-anchor="middle" font-size="10" fill="#534AB7">filter_suggestion_shown</text>

