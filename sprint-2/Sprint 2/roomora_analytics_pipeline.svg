  <line x1="700" y1="320" x2="900" y2="380" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="840" y="358" text-anchor="middle" font-size="10" fill="#1D9E75">batch (daily)</text>

