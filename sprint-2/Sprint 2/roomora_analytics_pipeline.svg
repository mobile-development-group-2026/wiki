  <rect x="80" y="412" width="180" height="60" rx="8" fill="white" stroke="#85B7EB" stroke-width="1"/>
  <text x="170" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">«stream processor»</text>
  <text x="170" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">Streaming Engine</text>
  <text x="170" y="463" text-anchor="middle" font-size="10" fill="#185FA5">Kafka / Flink</text>

  <line x1="260" y1="442" x2="300" y2="442" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <rect x="300" y="412" width="180" height="60" rx="8" fill="white" stroke="#85B7EB" stroke-width="1"/>
  <text x="390" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">«dashboard»</text>
  <text x="390" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">Real-time Monitor</text>
  <text x="390" y="463" text-anchor="middle" font-size="10" fill="#185FA5">GPS alert → visit (48h)</text>

