  <rect x="380" y="555" width="440" height="60" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="600" y="579" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">«storage» Data Warehouse</text>
  <text x="600" y="597" text-anchor="middle" font-size="11" fill="#854F0B">BigQuery / Snowflake · Clean, queryable, versioned</text>

  <!-- ─── ARROW WAREHOUSE → BI ─── -->
  <line x1="600" y1="615" x2="600" y2="645" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

