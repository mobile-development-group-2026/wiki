  <text x="520" y="165" text-anchor="middle" font-size="10" fill="#534AB7">user_registered</text>
  <text x="520" y="179" text-anchor="middle" font-size="10" fill="#534AB7">email_verified</text>
  <text x="520" y="193" text-anchor="middle" font-size="10" fill="#534AB7">profile_completed_24h</text>

