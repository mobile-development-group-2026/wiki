  <rect x="720" y="412" width="180" height="60" rx="8" fill="white" stroke="#97C459" stroke-width="1"/>
  <text x="810" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">«batch processor»</text>
  <text x="810" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">Batch Engine</text>
  <text x="810" y="463" text-anchor="middle" font-size="10" fill="#3B6D11">dbt / Spark</text>

  <line x1="900" y1="442" x2="940" y2="442" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <rect x="940" y="412" width="180" height="60" rx="8" fill="white" stroke="#97C459" stroke-width="1"/>
  <text x="1030" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">«aggregator»</text>
  <text x="1030" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">Historical Reports</text>
  <text x="1030" y="463" text-anchor="middle" font-size="10" fill="#3B6D11">Profile completion, listings</text>

  <!-- ─── ARROWS PATHS → WAREHOUSE ─── -->
  <line x1="280" y1="490" x2="520" y2="560" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="910" y1="490" x2="700" y2="560" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>

