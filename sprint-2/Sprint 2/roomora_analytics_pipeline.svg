  <line x1="140" y1="200" x2="540" y2="270" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="330" y1="200" x2="560" y2="270" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="200" x2="580" y2="270" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="710" y1="200" x2="620" y2="270" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="900" y1="200" x2="640" y2="270" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="200" x2="660" y2="270" stroke="#AFA9EC" stroke-width="1.2" marker-end="url(#arrow)"/>

