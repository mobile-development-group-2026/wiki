info:
  name: New listing
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/v1/listings
  headers:
    - name: X-Dev-Clerk-Id
      value: dev_landlord_1
  body:
    type: json
    data: |-
      {
          "listing": {
            "listing_type": "property",
            "title": "Test Apartment",
            "address": "100 Main St",
            "city": "Boston",
            "rent": 1500,
            "bedrooms": 2,
            "bathrooms": 1,
            "property_type": "apartment"
          }
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
